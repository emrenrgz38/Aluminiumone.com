<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALUMINIUM ONE | EXECUTIVE DASHBOARD</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>
  
  <style>
    /* Premium Executive Tasarım */
    .nc-app-header { border-bottom: 3px solid #00aaff !important; background: #000 !important; }
    .nc-app-left-menu { background: #f4f4f4 !important; border-right: 2px solid #00aaff !important; }
    .nc-app-header-title { color: #00aaff !important; font-weight: bold !important; }
  </style>

  <script>
    // Giriş yapınca admin paneline otomatik yönlendir
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
