backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "content"
    label: "SAYFA İÇERİKLERİ"
    files:
      - file: "content/home.json"
        label: "01. ANA SAYFA (HOME)"
        fields:
          - {label: "Ana Slogan", name: "hero_title", widget: "string"}
          - {label: "Arkaplan Resmi", name: "bg_image", widget: "image"}

      - file: "content/used-machines.json"
        label: "07. İKİNCİ EL (USED MACHINES)"
        fields:
          - label: "Makine Listesi"
            name: "machines"
            widget: "list"
            fields:
              - {label: "Model Adı", name: "model", widget: "string"}
              - {label: "Teknik Detay", name: "detail", widget: "markdown"}
              - {label: "Makine Fotoğrafı", name: "photo", widget: "image"}
