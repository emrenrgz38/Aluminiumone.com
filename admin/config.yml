backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "pages"
    label: "SAYFA İÇERİKLERİ"
    files:
      # 01. HOME (SLIDER & HERO)
      - name: "home"
        file: "content/home.json"
        label: "01. ANA SAYFA (HOME)"
        fields:
          - {label: "Ana Slogan", name: "hero_title", widget: "string"}
          - {label: "Kapak Görseli", name: "bg_image", widget: "image"}
          - {label: "Alt Metin", name: "hero_subtitle", widget: "string"}

      # 02. ABOUT US (Sitedeki 3'lü Kart Yapısı)
      - name: "about"
        file: "content/about.json"
        label: "02. HAKKIMIZDA (ABOUT US)"
        fields:
          - {label: "Kurumsal Giriş Metni", name: "content", widget: "markdown"}
          - label: "Vizyon-Misyon-HR Kartları"
            name: "cards"
            widget: "list"
            fields:
              - {label: "Kart Başlığı", name: "title", widget: "string"}
              - {label: "İçerik Metni", name: "text", widget: "text"}

      # 03. PRODUCTS (Döküm, Pres, Yüzey İşlem)
      - name: "products"
        file: "content/products.json"
        label: "03. ÜRÜNLER (PRODUCTS)"
        fields:
          - label: "Ürün Kategorileri"
            name: "list"
            widget: "list"
            fields:
              - {label: "Ürün Grubu Adı", name: "title", widget: "string"}
              - {label: "Temsil Edilen Markalar", name: "subtitle", widget: "string"}
              - {label: "Kapak Fotoğrafı", name: "img", widget: "image"}

      # 04. PROJECTS (Tamamlanan Tesisler)
      - name: "projects"
        file: "content/projects.json"
        label: "04. PROJELER (PROJECTS)"
        fields:
          - label: "Proje Detayları"
            name: "list"
            widget: "list"
            fields:
              - {label: "Proje İsmi", name: "title", widget: "string"}
              - {label: "Açıklama (Tablo/Metin)", name: "detail", widget: "markdown"}
              - {label: "Proje Görseli", name: "image", widget: "image"}

      # 05. SERVICES (Foundry, Extrusion, Surface, Mechanical)
      - name: "services"
        file: "content/services.json"
        label: "05. SERVİSLER / ÜRETİM (SERVICES)"
        fields:
          - label: "Üretim Hattı Detayları"
            name: "service_list"
            widget: "list"
            fields:
              - {label: "Bölüm Adı", name: "title", widget: "string"}
              - {label: "Teknik Tablo ve Veriler", name: "description", widget: "markdown"}
              - {label: "Bölüm Fotoğrafı", name: "image", widget: "image"}

      # 06. NEWS (Haber Kartları)
      - name: "news"
        file: "content/news.json"
        label: "06. HABERLER (NEWS)"
        fields:
          - label: "Haber Listesi"
            name: "list"
            widget: "list"
            fields:
              - {label: "Haber Başlığı", name: "title", widget: "string"}
              - {label: "Kısa Özet (Kart Üstü)", name: "summary", widget: "text"}
              - {label: "Haber Detayı", name: "content", widget: "markdown"}
              - {label: "Görsel", name: "image", widget: "image"}

      # 07. CONTACT
      - name: "contact"
        file: "content/contact.json"
        label: "07. İLETİŞİM (CONTACT)"
        fields:
          - {label: "Adres Bilgisi", name: "address", widget: "text"}
          - {label: "E-posta", name: "email", widget: "string"}
          - {label: "Telefon", name: "phone", widget: "string"}
          - {label: "Harita (Embed Link)", name: "map_url", widget: "string"}

      # 08. REFERENCES (Logo Kaydırıcı)
      - name: "references"
        file: "content/references.json"
        label: "08. REFERANSLAR (REFERENCES)"
        fields:
          - label: "Müşteri Logoları"
            name: "logos"
            widget: "list"
            fields:
              - {label: "Firma Adı", name: "company", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image"}

      # 09. USED MACHINES (Çoklu Galeri ve Teknik Detay)
      - name: "used-machines"
        file: "content/used-machines.json"
        label: "09. İKİNCİ EL (USED MACHINES)"
        fields:
          - label: "Satılık Makineler"
            name: "machines"
            widget: "list"
            fields:
              - {label: "Makine Modeli/Adı", name: "model", widget: "string"}
              - {label: "Teknik Veriler (Mavi Çizgili Yapı)", name: "detail", widget: "markdown"}
              - label: "Makine Fotoğrafları"
                name: "gallery"
                widget: "list"
                fields:
                  - {label: "Resim Seç", name: "photo", widget: "image"}
